[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-proofread"
version = "0.1.0"
description = "A toolkit for proofreading Chinese book manuscripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "openai",
    "python-dotenv",
    "jieba",
    "numpy",
    "scikit-learn",
    "mdict-utils",
    "loguru",
    "pymupdf4llm",
    "rapidfuzz",
]

[tool.setuptools]
packages = {find = {}} # 自动发现src目录下的所有包

